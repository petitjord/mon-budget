<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F0E17" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Patrick"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Suivi de budget personnel, hors ligne, sur ton téléphone."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>Budget Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Concept : moderne et doux. Fond lavande très pâle, cartes blanches très arrondies, un dégradé violet pour la carte principale, vert pour l'argent qui rentre, corail pour ce qui sort. Barre d'onglets flottante et translucide. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --surface2:#F1EFF9; --ink:#1D1A2F; --muted:#6F6B88; --line:#ECE9F5;
  --accent:#6C5CE7; --accent-ink:#FFFFFF; --accent-soft:#EDEAFD;
  --rev:#109D74; --rev-soft:#E1F5EE; --dep:#E8604F; --dep-soft:#FDECE9; --epa:#3B76EE; --epa-soft:#E6EEFE;
  --bad:#DC3F45; --bad-soft:#FDE8E9; --warn:#B9730C;
  --hero:linear-gradient(140deg,#6C5CE7 0%,#8B6CF1 55%,#BC86F6 100%); --hero-shadow:0 14px 34px -12px rgba(108,92,231,.55);
  --bar:#E1DCFA; --glass:rgba(255,255,255,.78);
  --shadow:0 1px 2px rgba(40,30,90,.04),0 10px 28px -10px rgba(60,40,140,.13);
  --r:22px;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E17; --surface:#1A1826; --surface2:#24212F; --ink:#F2F0FA; --muted:#A29EBA; --line:#2B283B;
  --accent:#A496FF; --accent-ink:#17123A; --accent-soft:#2B2650;
  --rev:#4CD9A7; --rev-soft:#15302A; --dep:#FF8B7D; --dep-soft:#3A201E; --epa:#80A8FF; --epa-soft:#1D2742;
  --bad:#FF7D80; --bad-soft:#3B1D22; --warn:#E8B04F;
  --hero:linear-gradient(140deg,#4B3CC2 0%,#6747CF 55%,#9150C6 100%); --hero-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --bar:#37315A; --glass:rgba(26,24,38,.8);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -10px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E17; --surface:#1A1826; --surface2:#24212F; --ink:#F2F0FA; --muted:#A29EBA; --line:#2B283B;
  --accent:#A496FF; --accent-ink:#17123A; --accent-soft:#2B2650;
  --rev:#4CD9A7; --rev-soft:#15302A; --dep:#FF8B7D; --dep-soft:#3A201E; --epa:#80A8FF; --epa-soft:#1D2742;
  --bad:#FF7D80; --bad-soft:#3B1D22; --warn:#E8B04F;
  --hero:linear-gradient(140deg,#4B3CC2 0%,#6747CF 55%,#9150C6 100%); --hero-shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --bar:#37315A; --glass:rgba(26,24,38,.8);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -10px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 130px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.in-t{resize:vertical;display:block}
.app{max-width:560px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.neg{color:var(--bad)}
.muted{color:var(--muted)}
.t-rev{color:var(--rev)} .t-dep{color:var(--dep)} .t-epa{color:var(--epa)}
/* en-tête */
.head{display:flex;align-items:center;justify-content:space-between;padding-block:calc(14px + env(safe-area-inset-top,0px)) 0}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding-block:10px 14px}
.mnav{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.mnav b{flex:1;text-align:center;font-size:16px;font-weight:700;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:14px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.head .iconbtn{background:var(--surface);box-shadow:var(--shadow)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.3}
/* blocs */
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:28px 2px 12px}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.cardhead b{font-size:15px}
.hero{background:var(--hero);color:#fff;box-shadow:var(--hero-shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero .lbl{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85)}
.hero .big{font-size:38px;line-height:1.1;margin:6px 0 4px;display:block;color:#fff;letter-spacing:-.03em}
.hero .sub{font-size:13px;color:rgba(255,255,255,.82)}
.hero .num{color:#fff}
.hero .neg,.hero .num.neg{color:#FFD1CC}
.hero .note-line{color:#fff}
.hero .sum4 div{color:rgba(255,255,255,.8)}
.hero .sum4 .num{color:#fff}
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:14px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero .prog{background:rgba(255,255,255,.22)}
.hero .prog i{background:#fff}
.prog.over i{background:var(--bad)}
.hero .prog.over i{background:#FFB4AB}
.note-line{font-size:13.5px;font-weight:700}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.mini{background:var(--surface);border:0;border-radius:20px;padding:14px;box-shadow:var(--shadow);color:var(--ink);font:inherit}
.mini .l{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.mini .l::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mc,var(--accent))}
.mini .v{font-size:19px;display:block;margin-top:4px}
.mini .p{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.m-rev{--mc:var(--rev)} .m-rev .v{color:var(--rev)}
.m-epa{--mc:var(--epa)} .m-epa .v{color:var(--epa)}
.m-bad{--mc:var(--bad);background:var(--bad-soft)} .m-bad .v{color:var(--bad)}
.list{background:var(--surface);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;transition:background .15s}
.row:last-child{border-bottom:0}
button.row:active{background:var(--surface2)}
.row .l{min-width:0}
.row .l b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l span{font-size:12.5px;color:var(--muted)}
.row.future{opacity:.55}
.lw{display:flex;align-items:center;gap:12px;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc,var(--accent));flex:none}
.lw .dot{width:34px;height:34px;border-radius:12px;background:color-mix(in srgb,var(--cc,var(--accent)) 16%,transparent);position:relative}
.lw .dot::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--cc,var(--accent))}
.nm{display:inline-flex;align-items:center;gap:8px}
.grp{display:flex;justify-content:space-between;padding:11px 16px;background:color-mix(in srgb,var(--cc,var(--accent)) 12%,var(--surface));font-size:12.5px;font-weight:700;color:var(--ink)}
.cat{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:13px 16px}
.cat:last-child{border-bottom:0}
button.cat:active{background:var(--surface2)}
.cat .top2{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.cat .chev{color:var(--muted);margin-left:4px}
.cat .prog{height:7px;margin:9px 0 0;background:color-mix(in srgb,var(--cc,var(--accent)) 14%,var(--surface2))}
.cat .prog i{background:var(--cc,var(--accent))}
.cat .prog.over i{background:var(--bad)}
.sheet .list{margin-top:6px;box-shadow:none;border:1px solid var(--line)}
.sheet .sumline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.sum4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sum4 div{font-size:12px;font-weight:600;color:var(--muted)}
.sum4 .num{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.sum4 .t-rev{color:var(--rev)} .sum4 .t-dep{color:var(--dep)} .sum4 .t-epa{color:var(--epa)}
/* graphiques */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-ui);font-size:10px;font-weight:600;fill:var(--muted)}
svg.chart text.cur{fill:var(--accent)}
svg.chart text.val{font-family:var(--f-num);font-size:11px;fill:var(--ink);font-weight:700}
svg.chart .bar{fill:var(--bar)}
svg.chart .bar.sel{fill:var(--accent)}
svg.chart .bar.n{fill:var(--bad);opacity:.35}
svg.chart .bar.n.sel{opacity:1}
svg.chart .zero,svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .grid{stroke-dasharray:3 4}
svg.chart rect.hit{fill:transparent;cursor:pointer}
svg.trend .tp{fill:var(--bar)}
svg.trend .tp.sel{fill:color-mix(in srgb,var(--accent) 35%,var(--bar))}
svg.trend .tr{fill:color-mix(in srgb,var(--accent) 55%,var(--surface))}
svg.trend .tr.sel{fill:var(--accent)}
svg.trend .tr.over{fill:var(--bad)}
.leg2{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.leg2 i{display:inline-block;width:10px;height:10px;border-radius:3px}
.leg2 .lp{background:var(--bar)} .leg2 .lr{background:var(--accent);margin-left:6px}
.cmp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmp .lbl{font-size:13px;color:var(--muted);font-weight:600;display:block}
.big2{font-size:26px;display:block;margin-top:2px}
.pill{font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-good{background:var(--rev-soft);color:var(--rev)}
.dwrap{display:flex;align-items:center;gap:16px;margin-top:6px}
svg.donut{width:136px;height:136px;flex:none}
svg.donut .trk{fill:none;stroke:var(--surface2);stroke-width:16}
svg.donut .seg-arc{fill:none;stroke-width:16;stroke-linecap:round}
svg.donut .dc1{font-family:var(--f-num);font-weight:800;font-size:16px;fill:var(--ink)}
svg.donut .dc2{font-family:var(--f-ui);font-size:10.5px;font-weight:600;fill:var(--muted)}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.legend .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .num{font-size:12.5px;color:var(--muted)}
/* crédits */
.credit{display:block;font:inherit;color:inherit;border:0}
.credit .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:0}
.credit .head b{font-weight:700}
.credit .meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.credit .prog i{background:var(--epa)}
.credit + .credit{margin-top:12px}
/* boutons */
.btn{width:100%;padding:15px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;transition:transform .12s,filter .12s;box-shadow:0 8px 20px -10px var(--accent)}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.small{width:auto;padding:11px 16px;font-size:14px}
.btns{display:grid;gap:10px;margin-top:18px}
.addbtn{margin-top:14px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:14px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.welcome{text-align:center;padding:30px 20px}
.welcome h3{margin:0 0 8px;font-size:22px;font-weight:800}
.welcome p{margin:0 0 16px;color:var(--muted)}
/* barre d'onglets flottante */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:536px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 12px 34px -10px rgba(40,30,90,.28)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.1;text-align:center;min-width:0;border-radius:18px;transition:color .15s}
.tab svg{width:22px;height:22px;transition:transform .2s}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.fab{justify-self:center;width:54px;height:54px;border-radius:19px;border:0;background:var(--hero);color:#fff;display:grid;place-items:center;box-shadow:var(--hero-shadow);transition:transform .15s}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab svg{width:26px;height:26px}
/* feuille */
#ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,10,40,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:99px;background:var(--line)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;padding:10px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 2px 8px -2px rgba(40,30,90,.2)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 7px}
.in-t{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--surface2);font-size:16px;transition:border-color .15s,background .15s}
.in-t:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.amt-in{font-family:var(--f-num);font-size:36px;font-weight:800;text-align:center;padding:16px;letter-spacing:-.02em}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface2);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid12{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid12 label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.grid12 input{width:100%;padding:9px 8px;border-radius:10px;border:0;background:var(--surface2);font-family:var(--f-num);font-size:14px;text-align:right}
.fill{display:flex;gap:8px;margin-top:10px}
.fill input{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.4);animation:up .22s}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:10px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}
/* entrée animée au changement d'onglet */
.anim>*{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
.anim>*:nth-child(2){animation-delay:.03s}.anim>*:nth-child(3){animation-delay:.06s}.anim>*:nth-child(4){animation-delay:.09s}.anim>*:nth-child(5){animation-delay:.12s}.anim>*:nth-child(n+6){animation-delay:.15s}
.anim .prog i{animation:grow .7s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
.anim svg.donut .seg-arc{animation:fade .6s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
/* ===== Style « Minimal » (façon iPhone) : blanc, gris système, bleu iOS, aucune décoration ===== */
html[data-skin="minimal"][data-skin]{--bg:#F2F2F7;--surface:#FFFFFF;--surface2:#F2F2F7;--ink:#000000;--muted:#8A8A8E;--line:#E5E5EA;--accent:#007AFF;--accent-ink:#FFFFFF;--accent-soft:#E5F0FF;--rev:#28A745;--rev-soft:#E6F6EA;--dep:#FF3B30;--dep-soft:#FFEAE9;--epa:#5856D6;--epa-soft:#EEEEFB;--bad:#FF3B30;--bad-soft:#FFEAE9;--bar:#D1D1D6;--glass:rgba(249,249,249,.86);--shadow:none;--r:14px;--hero:var(--surface);--hero-shadow:none;--f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif}
@media (prefers-color-scheme: dark){html[data-skin="minimal"]:not([data-theme="light"]){--bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--ink:#FFFFFF;--muted:#98989F;--line:#38383A;--accent:#0A84FF;--accent-ink:#FFFFFF;--accent-soft:#0A2A4D;--rev:#32D74B;--rev-soft:#10301A;--dep:#FF453A;--dep-soft:#3A1614;--epa:#5E5CE6;--epa-soft:#1E1D44;--bad:#FF453A;--bad-soft:#3A1614;--bar:#48484A;--glass:rgba(22,22,24,.86)}}

  return s+'<text x="70" y="68" text-anchor="middle" class="dc1">'+esc(center)+'</text><text x="70" y="86" text-anchor="middle" class="dc2">'+esc(sub)+'</text></svg>';

function analysesHtml(m){

  h+='</section>';

  for(var g=1;g<=3;g++){var gy=base-(base-top)*g/3;svg+='<line class="grid" x1="4" x2="'+(W-4)+'" y1="'+gy+'" y2="'+gy+'"/>';}
  for(var k=0;k<12;k++){var cx=16+k*29.8,hp=P[k]/mx*(base-top),hr=Rl[k]/mx*(base-top),sel=k+1===m;

    svg+='<rect class="tr'+(sel?" sel":"")+(Rl[k]>P[k]&&P[k]>0?" over":"")+'" x="'+(cx-5)+'" y="'+(base-hr)+'" width="10" height="'+Math.max(hr,Rl[k]?2:0)+'" rx="4"/>';
    svg+='<text x="'+cx+'" y="'+(base+18)+'" text-anchor="middle"'+(sel?' class="cur"':'')+'>'+MONTHS[k].charAt(0)+'</text><rect class="hit" data-act="pick" data-m="'+(k+1)+'" x="'+(cx-15)+'" y="0" width="30" height="'+H+'"/>';}

  if(!syOn()){h+='<p class="muted" style="font-size:12px;margin:0 0 6px">Sauvegarde automatique et partage entre appareils, via ton projet Firebase privé.</p><textarea class="in-t" id="sy-cfg" rows="3" placeholder="Colle ici la configuration Firebase (firebaseConfig)" style="font-family:var(--f-num);font-size:12px"></textarea><input class="in-t" id="sy-mail" type="email" autocomplete="username" placeholder="E-mail" style="margin-top:6px"><input class="in-t" id="sy-pw" type="password" autocomplete="current-password" placeholder="Mot de passe (6 caractères min.)" style="margin-top:6px"><div class="fill"><button class="btn small" data-act="syin">Se connecter</button><button class="btn ghost small" data-act="syup">Créer le compte</button></div>';}
  h+='<label class="f">Sauvegarder</label><button class="btn ghost" data-act="export">Copier mes données</button><textarea class="in-t" id="bk" rows="4" readonly hidden style="margin-top:8px;font-family:var(--f-num);font-size:12px"></textarea>';
  h+='<label class="f" for="imp">Importer des données</label><textarea class="in-t" id="imp" rows="4" placeholder="Colle ici le texte de ta sauvegarde" style="font-family:var(--f-num);font-size:12px"></textarea>';
  h+='<div class="fill"><button class="btn small" data-act="import">Importer</button><label class="btn ghost small" style="margin:0;text-align:center;flex:1" for="impf">Choisir un fichier</label><input type="file" id="impf" accept=".json,application/json,text/plain" hidden></div>';
  h+='<p class="muted" style="font-size:12px;margin:8px 0 0">Importer remplace toutes les données actuelles.</p>';
  h+='<div class="btns" id="rstwrap"><button class="btn danger" data-act="rstask">Tout effacer</button></div><div class="btns"><button class="btn ghost" data-act="close">Fermer</button></div>';
  openSheet(h);
}
function doExport(){
  var j=exportJson(),ta=$("bk");ta.value=j;
  function show(){ta.hidden=false;ta.focus();ta.select();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(j).then(function(){toast("Données copiées");},function(){show();toast("Copie le texte ci-dessous");});}
  else{show();toast("Copie le texte ci-dessous");}
}
function doImport(){
  var txt=$("imp").value.trim(),o;
  if(!txt){toast("Colle d'abord le texte de ta sauvegarde");return;}
  try{o=JSON.parse(txt);}catch(e){toast("Texte illisible : copie-le en entier");return;}
  if(!o||typeof o!=="object"||!(Array.isArray(o.lines)||Array.isArray(o.ech)||Array.isArray(o.so)||Array.isArray(o.pl)||Array.isArray(o.tx))){toast("Ce n'est pas une sauvegarde de Budget");return;}
  importObj(o);
}
function validBk(o){return o&&typeof o==="object"&&(Array.isArray(o.lines)||Array.isArray(o.ech)||Array.isArray(o.so)||Array.isArray(o.pl)||Array.isArray(o.tx));}
function importObj(o){
  if(!validBk(o)){toast("Données illisibles");return;}
  KS.forEach(function(k){STORE[k]={};(Array.isArray(o[k])?o[k]:[]).forEach(function(d){if(!d||typeof d!=="object")return;var id=String(d.id||uid()),c={};Object.keys(d).forEach(function(x){if(x!=="id")c[x]=d[x];});STORE[k][id]=c;});});
  STORE.meta.welcomed=true;saveStore();notifyAll();closeSheet();toast("Données importées");
}
/* lien de partage : les données voyagent dans le lien (partie après #, jamais envoyée au serveur) */
function b64e(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";return decodeURIComponent(escape(atob(str)));}
function shareLink(){
  if(isEmpty()){toast("Rien à partager pour l'instant");return;}
  var url=location.origin+location.pathname+"#d="+b64e(exportJson());
  if(navigator.share){navigator.share({title:"Budget Patrick",text:"Ton budget est prêt : ouvre ce lien sur ton iPhone, puis Partager → Sur l'écran d'accueil.",url:url}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast("Lien copié");},function(){toast("Copie impossible");});}
}
var PENDING=null;
function checkLink(){
  var m=/^#d=(.+)$/.exec(location.hash||"");if(!m)return;
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  var o;try{o=JSON.parse(b64d(m[1]));}catch(e){toast("Lien abîmé : demande-le à nouveau");return;}
  if(!validBk(o))return;
  if(isEmpty()){importObj(o);toast("Ton budget est prêt");return;}
  PENDING=o;SH={k:"link"};
  openSheet('<h3>Importer les données du lien ?</h3><p class="muted" style="margin:0">Ce lien contient un budget. L\'importer remplacera les données déjà présentes sur ce téléphone.</p><div class="btns"><button class="btn" data-act="linkgo">Remplacer par les données du lien</button><button class="btn ghost" data-act="close">Garder mes données</button></div>');
}
function doReset(){var sk=STORE.meta.theme,st=STORE.meta.skin;KS.forEach(function(k){STORE[k]={};});STORE.meta={};if(sk)STORE.meta.theme=sk;if(st)STORE.meta.skin=st;saveStore();notifyAll();closeSheet();toast("Données effacées");}

/* ---------- synchronisation Firebase (REST, sans bibliothèque) ---------- */
var SYK="budget2.sync",SY=(function(){try{return JSON.parse(localStorage.getItem(SYK))||{};}catch(e){return {};}})(),syBusy=false,syTimer=null,syMsg="";
function sySave(){try{localStorage.setItem(SYK,JSON.stringify(SY));}catch(e){}}
function syOn(){return !!(SY.key&&SY.pid&&SY.rt&&SY.uid);}
function syFail(r,j){var m=(j&&j.error&&j.error.message)||("Erreur "+r.status);var t={EMAIL_EXISTS:"Ce compte existe déjà : utilise « Se connecter »",EMAIL_NOT_FOUND:"Compte inconnu : utilise « Créer le compte »",INVALID_PASSWORD:"Mot de passe incorrect",INVALID_LOGIN_CREDENTIALS:"E-mail ou mot de passe incorrect",WEAK_PASSWORD:"Mot de passe trop court (6 caractères minimum)",INVALID_EMAIL:"Adresse e-mail invalide",OPERATION_NOT_ALLOWED:"Active « E-mail/Mot de passe » dans Firebase → Authentication"};var k=String(m).split(" ")[0];return new Error(t[k]||(k==="PERMISSION_DENIED"?"Accès refusé : vérifie les règles Firestore":m));}
async function syPost(url,body,form){var r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:form?body:JSON.stringify(body)});var j={};try{j=await r.json();}catch(e){}if(!r.ok)throw syFail(r,j);return j;}
function syTok(j){SY.idt=j.idToken||j.id_token;SY.rt=j.refreshToken||j.refresh_token||SY.rt;SY.uid=j.localId||j.user_id||SY.uid;SY.exp=Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000;sySave();}
async function syAuth(mode,email,pw){var j=await syPost("https://identitytoolkit.googleapis.com/v1/accounts:"+(mode==="up"?"signUp":"signInWithPassword")+"?key="+encodeURIComponent(SY.key),{email:email,password:pw,returnSecureToken:true});SY.email=email;syTok(j);}
async function syToken(){if(SY.idt&&Date.now()<SY.exp)return SY.idt;var j=await syPost("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(SY.key),"grant_type=refresh_token&refresh_token="+encodeURIComponent(SY.rt),true);syTok(j);return SY.idt;}
function syUrl(){return "https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(SY.pid)+"/databases/(default)/documents/budgets/"+encodeURIComponent(SY.uid);}
function syPayload(){var o={};KS.forEach(function(k){o[k]=STORE[k];});return JSON.stringify(o);}
async function syGet(t){var r=await fetch(syUrl(),{headers:{Authorization:"Bearer "+t}});if(r.status===404)return null;var j={};try{j=await r.json();}catch(e){}if(!r.ok)throw syFail(r,j);var f=j.fields||{};return {ts:+((f.ts||{}).integerValue)||0,data:(f.data||{}).stringValue||""};}
async function syPut(t,ts){var r=await fetch(syUrl(),{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({fields:{ts:{integerValue:String(ts)},data:{stringValue:syPayload()}}})});if(!r.ok){var j={};try{j=await r.json();}catch(e){}throw syFail(r,j);}}
function syApply(txt,ts){var o=JSON.parse(txt);KS.forEach(function(k){STORE[k]=o[k]||{};});STORE.meta.welcomed=true;STORE.meta.mt=ts;try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}notifyAll();}
async function syncNow(manual){
  if(!syOn()||syBusy)return;syBusy=true;
  try{
    var t=await syToken(),rem=await syGet(t),mt=+STORE.meta.mt||0;
    if(rem&&rem.data&&rem.ts>mt){syApply(rem.data,rem.ts);syMsg="Données reçues du cloud";}
    else if(!rem||mt>rem.ts||manual&&mt!==rem.ts){var ts=mt||Date.now();if(!mt){STORE.meta.mt=ts;try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}}await syPut(t,ts);syMsg="Données envoyées au cloud";}
    else syMsg="Déjà à jour";
    SY.last=Date.now();SY.err="";sySave();
  }catch(e){SY.err=(e&&e.message)||"Échec";sySave();if(manual)toast(SY.err);}
  syBusy=false;syRefreshUI();
}
function syPush(){if(!syOn())return;clearTimeout(syTimer);syTimer=setTimeout(function(){syncNow(false);},1500);}
function syRefreshUI(){var el=document.getElementById("sysum");if(el)el.innerHTML=syHtml();}
function syHtml(){
  if(!syOn())return "";
  var d=SY.last?new Date(SY.last):null,hh=d?String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"):"";
  return '<p class="muted" style="font-size:13px;margin:4px 0 8px">Connecté : '+esc(SY.email||"")+'<br>'+(SY.err?'<b style="color:var(--neg,#c0392b)">'+esc(SY.err)+'</b>':(hh?'Dernière synchro à '+hh+' · '+esc(syMsg):'Pas encore synchronisé'))+'</p><div class="fill"><button class="btn small" data-act="syncnow">Synchroniser</button><button class="btn ghost small" data-act="syncoff">Se déconnecter</button></div>';
}
function syCfgParse(txt){var k=(txt.match(/apiKey["']?\s*[:=]\s*["']([^"']+)["']/)||[])[1],p=(txt.match(/projectId["']?\s*[:=]\s*["']([^"']+)["']/)||[])[1];return k&&p?{key:k,pid:p}:null;}
async function syConnect(mode){
  var email=$("sy-mail").value.trim(),pw=$("sy-pw").value;
  if(!syOn()||!SY.rt){var c=$("sy-cfg")?syCfgParse($("sy-cfg").value):null;if(c){SY.key=c.key;SY.pid=c.pid;}else if(!(SY.key&&SY.pid)){toast("Colle d'abord la configuration Firebase");return;}}
  if(!email||!pw){toast("E-mail et mot de passe requis");return;}
  try{toast("Connexion…");await syAuth(mode,email,pw);SY.err="";sySave();toast("Connecté");await syncNow(true);openSettings();}
  catch(e){toast(e.message||"Échec de la connexion");}
}
function syOff(){SY={};try{localStorage.removeItem(SYK);}catch(e){}openSettings();toast("Déconnecté (données conservées sur l'appareil)");}
document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow(false);});

/* ---------- événements ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");
  switch(a){
   case "mprev":if(S.m>1)S.m--;else if(YEAR>YMIN){YEAR--;S.m=12;}render();break;

   case "cfreq":SH.freq=el.getAttribute("data-v");document.querySelectorAll("#fseg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===SH.freq));});$("fb-m").hidden=SH.freq!=="mensuel";$("fb-u").hidden=SH.freq!=="unique";break;

   case "rstgo":doReset();break;
   case "ttype":SH.type=el.getAttribute("data-v");SH.cat="";document.querySelectorAll("#seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===SH.type));});$("chips").innerHTML=chipsHtml();break;
   case "chip":SH.cat=el.getAttribute("data-c");$("chips").innerHTML=chipsHtml();break;
   case "ckind":SH.kind=el.getAttribute("data-v");document.querySelectorAll("#seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===SH.kind));});break;
   case "fill":doFill();break;
   case "savetx":saveTx();break;
   case "saveline":saveLine();break;
   case "saveech":saveEch();break;
   case "savecl":saveCl();break;
   case "delask":$("delwrap").innerHTML='<button class="btn danger" data-act="delgo">Confirmer la suppression</button>';break;
   case "delgo":doDelete();break;
  }
});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="impf"&&e.target.files&&e.target.files[0]){var f=e.target.files[0],r=new FileReader();r.onload=function(){$("imp").value=String(r.result||"");toast("Fichier chargé : touche Importer");};r.readAsText(f);}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("ov").hidden)closeSheet();});

/* ---------- données : stockage local ---------- */
var KEY="budget2.v1";
var STORE={lines:{},ech:{},so:{},pl:{},tx:{},meta:{}},persistOK=true,SUBS={lines:[],ech:[],so:[],pl:[],tx:[]};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function loadStore(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);KS.forEach(function(k){STORE[k]=o[k]||{};});STORE.meta=o.meta||{};}}
  catch(e){persistOK=false;}
}
function saveStore(){STORE.meta.mt=Date.now();if(typeof syPush==="function")syPush();try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){persistOK=false;}}
function snapOf(name){return {docs:Object.keys(STORE[name]).map(function(id){return {id:id,data:function(){return STORE[name][id];}};})};}
function notify(name){SUBS[name].forEach(function(f){f(snapOf(name));});}
function notifyAll(){Object.keys(SUBS).forEach(notify);}
function makeDb(){
  return {collection:function(name){return {
    onSnapshot:function(next){SUBS[name].push(next);setTimeout(function(){next(snapOf(name));},0);},
    add:async function(d){STORE[name][uid()]=d;saveStore();notify(name);},
    doc:function(id){return {set:async function(d){STORE[name][id]=d;saveStore();notify(name);},delete:async function(){delete STORE[name][id];saveStore();notify(name);}};}
  };}};
}
function sub(name,key){
  db.collection(name).onSnapshot(function(snap){
    D[key]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});LOADED[key]=true;render();
  });
}
function applySkin(){var t=(STORE.meta&&STORE.meta.theme)||"auto",r=document.documentElement,sk=(STORE.meta&&STORE.meta.skin)||"minimal";r.setAttribute("data-skin",sk);if(sk==="premium")t="dark";if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);var dk=t==="dark"||(t==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.querySelectorAll('meta[name="theme-color"]').forEach(function(x){x.setAttribute("content",sk==="premium"?"#0A0A0C":(sk==="minimal"?(dk?"#000000":"#F2F2F7"):(dk?"#0F0E17":"#F6F5FB")));});}
loadStore();applySkin();setTimeout(function(){syncNow(false);},600);db=makeDb();dbState="ok";
render();
KS.forEach(function(k){sub(k,k);});
setTimeout(checkLink,50);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
